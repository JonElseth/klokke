<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
      :root {
        --bg-color: #f1f5f9;
        --text-main: #1e293b;
        --accent-color: #3498db;
        --focus-bg: #ffffff;
        --focus-text: #1e293b;
      }
      body.natt-modus {
        --bg-color: #0f172a;
        --text-main: #f1f5f9;
        --accent-color: #60a5fa;
        --focus-bg: #1e293b;
        --focus-text: #ffffff;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        touch-action: none;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "Poppins", sans-serif;
        transition:
          background-color 0.5s,
          color 0.5s;
      }
      #app-container {
        padding: 50px 60px;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
      }
      #fokus-boks {
        padding: 25px;
        margin-bottom: 10px;
        color: var(--focus-text);
        background-color: var(--focus-bg);
        border: 1px solid var(--accent-color);
        border-radius: 16px;
        font-size: 2.4rem;
        font-weight: 900;
      }
      .fokus-linje,
      .rutine-element {
        display: flex;
        align-items: center;
      }
      .fokus-linje {
        height: 55px;
        padding: 0 20px;
        margin: 5px 0;
        margin-left: 30px;
        border-radius: 12px;
        border: 1px solid var(--accent-color);
        background-color: var(--focus-bg);
        color: var(--focus-text);
        font-size: 1.55rem;
        font-weight: 900;
        box-sizing: border-box;
      }
      h2 {
        font-size: 2.2rem;
        font-weight: 900;
        margin: 0;
      }
      .kategori-overskrift {
        font-size: 2.2rem;
        font-weight: 900;
        margin: 0;
      }
      .kategori-overskrift:not(:first-of-type) {
        margin-top: 60px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .digital-clock-big {
        font-family: "Poppins", monospace;
        font-size: 142px;
        font-weight: 500;
        line-height: 0.72;
        letter-spacing: -5px;
      }
      .hovedinnhold {
        display: flex;
        gap: 60px;
        flex-wrap: wrap;
      }
      .kolonne {
        flex: 0 0 auto;
        min-width: 300px;
      }
      #avtale-kolonne {
        flex: 1;
      }
      #bilde-container {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 20px;
        margin-bottom: 40px;
      }
      .tom-kolonne-bilde {
        width: 100%;
        height: 300px;
        object-fit: cover;
        border-radius: 16px;
        display: block;
      }
      #fremtidige-container {
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }
      .vis-fremtidige {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      .rutine-element {
        font-size: 1.55rem;
        margin: 10px 0;
        padding-left: 50px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 4px 10px;
        border-radius: 6px;
        color: white;
        margin: 0 10px;
        font-weight: 700;
        font-size: 0.9em;
        height: 32px;
        min-width: 100px;
      }
      .badge-p {
        background-color: #d97706;
      }
      .badge-m {
        background-color: #16a34a;
      }
      .badge-mp {
        background-color: #0891b2;
      }
      .skillelinje {
        display: none;
        border-bottom: 2px dashed var(--text-main);
        margin: 20px 0;
        width: calc(100% - 85px);
      }
      .tid {
        font-family: "Roboto Mono", monospace;
        color: var(--accent-color);
        font-weight: 700;
        min-width: 90px;
        display: inline-block;
      }
      #avtale-innhold {
        margin-bottom: 40px;
      }
      @media (max-width: 968px) {
        #app-container {
          padding: 10px;
        }
        .digital-clock-big {
          font-size: 60px;
        }
        #status-tekst {
          font-size: 1.5rem !important;
        }
        .hovedinnhold {
          flex-direction: column;
          gap: 10px;
        }
        .fokus-linje {
          height: auto;
          padding: 10px;
          font-size: 1.1rem;
          margin-left: 0;
        }
        .rutine-element {
          padding-left: 10px;
          font-size: 1.1rem;
        }
        .badge {
          height: 25px;
          min-width: 70px;
          font-size: 0.8rem;
        }
        #fokus-boks {
          padding: 15px;
          font-size: 1.5rem;
          margin-bottom: 10px;
        }
        #fokus-boks .badge {
          height: 25px;
          min-width: 70px;
          font-size: 0.8rem;
          padding: 2px 8px;
        }
        .tid {
          min-width: 60px !important;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="info-modal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          background: white;
          padding: 30px;
          border-radius: 20px;
          text-align: center;
          color: #1e293b;
        "
      >
        <h2>Skann for bruksanvisning</h2>
        <img src="qr-kode.png" alt="QR" style="width: 250px; height: 250px" />
        <br />
        <button
          id="lukk-modal"
          style="
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 10px;
            background: #3498db;
            color: white;
            border: none;
          "
        >
          Lukk
        </button>
      </div>
    </div>
    <div id="app-container">
      <header>
        <div class="digital-clock-big" id="digital-clock">00:00</div>
        <div style="text-align: right">
          <div
            id="status-tekst"
            style="font-size: 3rem; font-weight: 700"
          ></div>
          <div
            id="dato-tekst"
            style="
              font-size: 2rem;
              display: flex;
              align-items: center;
              justify-content: flex-end;
              gap: 10px;
            "
          >
            <span id="dato-innhold"></span>
            <span id="info-knapp" style="cursor: pointer; font-size: 1.5rem"
              >ℹ️</span
            >
          </div>
        </div>
      </header>
      <div id="fokus-boks" style="display: none">Laster...</div>
      <div class="hovedinnhold">
        <div class="kolonne">
          <h2>Rutiner</h2>
          <div id="rutiner-liste"></div>
        </div>
        <div class="kolonne" id="avtale-kolonne">
          <div id="bilde-container">
            <img src="0.jpg" class="tom-kolonne-bilde" alt="Ingen avtaler" />
          </div>
          <div id="avtale-innhold"></div>
          <div id="fremtidige-container"></div>
        </div>
      </div>
    </div>
    <script>
      // HER LIME DU INN INFORMASJONEN DIN UNDER
      const API_KEY = "AIzaSyAMeiF7aD3eNmSy4YZUN97WT2LWZMYiBT0";
      const CALENDAR_ID =
        "a612aa990b57d4c149f2edfdb080883972e580c6dbddd06b7b6f5aae343c7f51@group.calendar.google.com";

      function initClient() {
        gapi.client
          .init({
            apiKey: API_KEY,
            discoveryDocs: [
              "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest",
            ],
          })
          .then(oppdaterDashbord);
      }
      gapi.load("client", initClient);

      // HER LIME DU INN INFORMASJONEN DIN OVER

      function oppdaterTema(time) {
        document.body.classList.toggle("natt-modus", time >= 22 || time < 6);
      }
      function lagBadge(sum) {
        if (sum.startsWith("P:"))
          return `<span class="badge badge-p">Pappa</span>`;
        if (sum.startsWith("M&P:"))
          return `<span class="badge badge-mp">M & P</span>`;
        if (sum.startsWith("M:"))
          return `<span class="badge badge-m">Mamma</span>`;
        return "";
      }
      function rensTekst(sum) {
        return sum.replace(/^(P:|M:|M&P:)\s*/, "");
      }
      function hentStatusTekst(h) {
        return h < 6
          ? "Det er natt"
          : h < 9
            ? "Det er morgen"
            : h < 12
              ? "Det er formiddag"
              : h < 18
                ? "Det er ettermiddag"
                : "Det er kveld";
      }

      let forrigeDato = new Date().toDateString();
      async function oppdaterDashbord() {
        try {
          const nå = new Date();
          if (nå.toDateString() !== forrigeDato) {
            location.reload();
            return;
          }
          forrigeDato = nå.toDateString();
          const res = await fetch(
            `http://${window.location.hostname}:3000/api/kalender?t=` +
              nå.getTime(),
          );
          const data = await res.json();
          const nåTid = nå.getTime();
          const tjuefireTimerFrem = nåTid + 24 * 60 * 60 * 1000;
          const trettiMin = 30 * 60 * 1000;
          oppdaterTema(nå.getHours());
          const idagStr = nå.toLocaleDateString("sv-SE", {
            timeZone: "Europe/Oslo",
          });

          document.querySelector(".tom-kolonne-bilde").src =
            `${nå.getDay()}.jpg`;
          document.getElementById("digital-clock").innerText =
            nå.toLocaleTimeString("no-NO", {
              hour: "2-digit",
              minute: "2-digit",
            });
          document.getElementById("status-tekst").innerText = hentStatusTekst(
            nå.getHours(),
          );
          let dagsDato = nå.toLocaleDateString("no-NO", {
            weekday: "long",
            day: "numeric",
            month: "long",
          });
          document.getElementById("dato-innhold").innerText =
            dagsDato.charAt(0).toUpperCase() + dagsDato.slice(1).toLowerCase();

          const rutiner = data.filter((e) => {
            if (!e.summary.startsWith("R:")) return false;
            const startTid = new Date(
              e.start.dateTime || e.start.date,
            ).getTime();
            return (
              (e.start.dateTime || e.start.date).startsWith(idagStr) &&
              startTid >= nåTid - trettiMin
            );
          });
          document.getElementById("rutiner-liste").innerHTML =
            rutiner.length === 0
              ? '<div class="rutine-element">Ingen flere rutiner i dag.</div>'
              : rutiner
                  .map((r) => {
                    const startTid = new Date(
                      r.start.dateTime || r.start.date,
                    ).getTime();
                    const erAktiv =
                      startTid - nåTid <= trettiMin &&
                      startTid - nåTid >= -trettiMin;
                    return `<div class="${erAktiv ? "fokus-linje" : "rutine-element"}"><span class="tid">${(r.start.dateTime || r.start.date).split("T")[1].substring(0, 5)}</span> ${r.summary.replace("R:", "")}</div>`;
                  })
                  .join("");

          const avtaler = data
            .filter(
              (e) =>
                e.summary.startsWith("P:") ||
                e.summary.startsWith("M:") ||
                e.summary.startsWith("M&P:"),
            )
            .sort(
              (a, b) =>
                new Date(a.start.dateTime || a.start.date) -
                new Date(b.start.dateTime || b.start.date),
            );
          const dagens = avtaler.filter((a) =>
            (a.start.dateTime || a.start.date).startsWith(idagStr),
          );

          const nesteAvtale = avtaler.find((a) => {
            const startTid = new Date(
              a.start.dateTime || a.start.date,
            ).getTime();
            return (
              startTid >= nåTid - trettiMin && startTid <= tjuefireTimerFrem
            );
          });

          const fokusBoks = document.getElementById("fokus-boks");
          if (nesteAvtale) {
            fokusBoks.style.display = "block";
            const avtaleDato = new Date(
              nesteAvtale.start.dateTime || nesteAvtale.start.date,
            );
            const erIMorgen = avtaleDato.toDateString() !== nå.toDateString();
            fokusBoks.innerHTML = `<div><span class="tid">${(nesteAvtale.start.dateTime || nesteAvtale.start.date).split("T")[1].substring(0, 5)}</span> ${erIMorgen ? "I morgen! " : ""}${lagBadge(nesteAvtale.summary)} ${rensTekst(nesteAvtale.summary)}</div>`;
          } else {
            fokusBoks.style.display = "none";
          }

          document.getElementById("bilde-container").style.display =
            nesteAvtale &&
            new Date(
              nesteAvtale.start.dateTime || nesteAvtale.start.date,
            ).getTime() <
              nåTid + 2 * 60 * 60 * 1000
              ? "none"
              : "block";

          const wrapper = document.getElementById("avtale-innhold");
          const flereIdag = dagens.filter(
            (a) => nesteAvtale && a.id !== nesteAvtale.id,
          );
          if (flereIdag.length > 0) {
            wrapper.innerHTML =
              `<h2 class="kategori-overskrift">Flere avtaler</h2>` +
              flereIdag
                .map(
                  (a) =>
                    `<div class="fokus-linje"><span class="tid">${(a.start.dateTime || a.start.date).split("T")[1].substring(0, 5)}</span> ${lagBadge(a.summary)} ${rensTekst(a.summary)}</div>`,
                )
                .join("");
          } else {
            wrapper.innerHTML = "";
          }

          const fremtidWrapper = document.getElementById(
            "fremtidige-container",
          );
          fremtidWrapper.innerHTML = "";
          const imorgenStart = new Date(nå);
          imorgenStart.setDate(imorgenStart.getDate() + 1);
          imorgenStart.setHours(0, 0, 0, 0);
          const fremtidige = avtaler.filter(
            (a) =>
              new Date(a.start.dateTime || a.start.date).getTime() >=
              imorgenStart.getTime(),
          );
          if (fremtidige.length > 0) {
            const grupper = {};
            fremtidige.forEach((a) => {
              const d = (a.start.dateTime || a.start.date).split("T")[0];
              if (!grupper[d]) grupper[d] = [];
              grupper[d].push(a);
            });
            Object.keys(grupper)
              .sort()
              .forEach((d) => {
                const avtaleDato = new Date(d);
                const iMorgen = new Date();
                iMorgen.setDate(iMorgen.getDate() + 1);
                const erIMorgen =
                  avtaleDato.toDateString() === iMorgen.toDateString();
                const overskrift = erIMorgen
                  ? "Avtaler i morgen"
                  : avtaleDato
                      .toLocaleDateString("no-NO", {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                      })
                      .replace(/^\w/, (c) => c.toUpperCase());
                fremtidWrapper.innerHTML += `<div class="kategori-overskrift">${overskrift}</div>`;
                grupper[d].forEach(
                  (a) =>
                    (fremtidWrapper.innerHTML += `<div class="rutine-element"><span class="tid">${(a.start.dateTime || a.start.date).split("T")[1].substring(0, 5)}</span> ${lagBadge(a.summary)} ${rensTekst(a.summary)}</div>`),
                );
                fremtidWrapper.innerHTML += `<div class="skillelinje"></div>`;
              });
          }
        } catch (err) {
          console.error(err);
        }
      }

      let inaktivitetsTimer;
      function resetTimer() {
        clearTimeout(inaktivitetsTimer);
        inaktivitetsTimer = setTimeout(() => {
          document.getElementById("app-container").scrollTop = 0;
        }, 60000);
      }
      const container = document.getElementById("app-container");
      container.addEventListener("scroll", (e) => {
        document
          .getElementById("fremtidige-container")
          .classList.toggle("vis-fremtidige", e.target.scrollTop > 20);
        resetTimer();
      });
      container.addEventListener("touchstart", resetTimer);
      container.addEventListener("mousemove", resetTimer);

      document
        .getElementById("info-knapp")
        .addEventListener(
          "click",
          () => (document.getElementById("info-modal").style.display = "flex"),
        );
      document
        .getElementById("lukk-modal")
        .addEventListener(
          "click",
          () => (document.getElementById("info-modal").style.display = "none"),
        );
      setInterval(oppdaterDashbord, 60000);
      oppdaterDashbord();
      resetTimer();
    </script>
  </body>
</html>
